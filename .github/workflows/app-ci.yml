name: App CI

on:
  push:
    paths: ["app/**", ".github/workflows/app-ci.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app-ci.yml"]

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Public pages and guest redirects only need syntactically valid values.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Unit tests plus RLS boundary tests on the real migrations (PGlite).
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: app/test-results
          retention-days: 7

  journeys:
    # Full trainer/student journeys on the dedicated test project. Skipped
    # until the repository has the E2E_SUPABASE_URL / E2E_SUPABASE_KEY secrets.
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_SUPABASE: "1"
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_KEY: ${{ secrets.E2E_SUPABASE_KEY }}
    steps:
      # Checkout first: the job's default working directory is app/.
      - uses: actions/checkout@v7
      - name: Check secrets
        id: secrets
        run: |
          echo "ready=${{ secrets.E2E_SUPABASE_URL != '' && secrets.E2E_SUPABASE_KEY != '' }}" >> "$GITHUB_OUTPUT"
          echo "firebase=${{ secrets.E2E_SUPABASE_SECRET_KEY != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci
      - if: steps.secrets.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.secrets.outputs.ready == 'true'
        run: npx playwright test e2e/flows.spec.ts --project=desktop
        env:
          CI: "true"
      # Same journeys through Firebase login, on the local Auth emulator. Needs
      # the test project's secret key (E2E_SUPABASE_SECRET_KEY) for linking.
      - name: Start the Firebase Auth emulator
        if: steps.secrets.outputs.ready == 'true' && steps.secrets.outputs.firebase == 'true'
        run: |
          npx -y firebase-tools@14 emulators:start --only auth --project demo-fitflow --config e2e/firebase.json > emulator.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:9099/ > /dev/null && exit 0; sleep 2; done
          cat emulator.log; exit 1
      - if: steps.secrets.outputs.ready == 'true' && steps.secrets.outputs.firebase == 'true'
        run: npx playwright test e2e/flows.spec.ts --project=desktop
        env:
          CI: "true"
          E2E_FIREBASE: "1"
          E2E_SUPABASE_SECRET_KEY: ${{ secrets.E2E_SUPABASE_SECRET_KEY }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: journeys-report
          path: app/test-results
          retention-days: 7
