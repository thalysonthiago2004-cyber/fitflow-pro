name: App CI

on:
  push:
    paths: ["app/**", ".github/workflows/app-ci.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app-ci.yml"]

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Public pages and guest redirects only need syntactically valid values.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Unit tests plus RLS boundary tests on the real migrations (PGlite).
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app/test-results
          retention-days: 7

  journeys:
    # Full trainer/student journeys on the dedicated test project. Skipped
    # until the repository has the E2E_SUPABASE_URL / E2E_SUPABASE_KEY secrets.
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_SUPABASE: "1"
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_KEY: ${{ secrets.E2E_SUPABASE_KEY }}
    steps:
      - name: Check secrets
        id: secrets
        run: echo "ready=${{ secrets.E2E_SUPABASE_URL != '' && secrets.E2E_SUPABASE_KEY != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci
      - if: steps.secrets.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.secrets.outputs.ready == 'true'
        run: npx playwright test e2e/flows.spec.ts --project=desktop
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: journeys-report
          path: app/test-results
          retention-days: 7
